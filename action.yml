name: "contrib-gallery chart"
description: "Generate a contribution graph style from contrib-gallery as an SVG file in your repo."
author: "inferism"
branding:
  icon: "bar-chart-2"
  color: "gray-dark"

inputs:
  style:
    description: "Style name, for example spiral-galaxy"
    required: true
  theme:
    description: "Color theme: mono, ice, ember, matrix, sakura, violet, gold, rose, teal, lime, indigo, orchid, sand, aqua, slate or azure"
    required: false
    default: "mono"
  accent:
    description: "Custom accent color like #ff66aa. Overrides theme."
    required: false
    default: ""
  mode:
    description: "auto (default) follows the viewer's light or dark setting, or dark or light"
    required: false
    default: "auto"
  frame:
    description: "none (default), simple, brackets or terminal"
    required: false
    default: "none"
  header:
    description: "none (default), title or terminal"
    required: false
    default: "none"
  details:
    description: "hide (default) or show decorations and a stats line"
    required: false
    default: "hide"
  background:
    description: "Page color behind the chart, like #0a0a0a"
    required: false
    default: ""
  username:
    description: "GitHub user to chart. Defaults to the repository owner."
    required: false
    default: ${{ github.repository_owner }}
  token:
    description: "Token used to read contribution data"
    required: false
    default: ${{ github.token }}
  output-dir:
    description: "Folder the SVG is written to"
    required: false
    default: "contrib-charts"

runs:
  using: "composite"
  steps:
    - name: Generate chart
      shell: bash
      env:
        STYLE: ${{ inputs.style }}
        THEME: ${{ inputs.theme }}
        ACCENT: ${{ inputs.accent }}
        MODE: ${{ inputs.mode }}
        FRAME: ${{ inputs.frame }}
        HEADER: ${{ inputs.header }}
        DETAILS: ${{ inputs.details }}
        BACKGROUND: ${{ inputs.background }}
        CONTRIB_USERNAME: ${{ inputs.username }}
        OUT_DIR: ${{ inputs.output-dir }}
        GH_TOKEN: ${{ inputs.token }}
        ACTION_PATH: ${{ github.action_path }}
      run: python3 "$ACTION_PATH/generator/generate.py" --style "$STYLE" --theme "$THEME" --accent "$ACCENT" --mode "$MODE" --frame "$FRAME" --header "$HEADER" --details "$DETAILS" --background "$BACKGROUND" --out "$OUT_DIR"
