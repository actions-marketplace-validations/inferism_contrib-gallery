name: "contrib-gallery chart"
description: "Generate a contribution graph style from contrib-gallery as an SVG file in your repo."
author: "inferism"
branding:
  icon: "bar-chart-2"
  color: "gray-dark"

inputs:
  style:
    description: "Style name, for example spiral-galaxy"
    required: true
  theme:
    description: "Color theme: mono, ice, ember, matrix, sakura or violet"
    required: false
    default: "mono"
  accent:
    description: "Custom accent color like #ff66aa. Overrides theme."
    required: false
    default: ""
  mode:
    description: "dark (default) or light, for light READMEs"
    required: false
    default: "dark"
  frame:
    description: "terminal (default) has a border and corner brackets; none blends into the page"
    required: false
    default: "terminal"
  header:
    description: "show (default) or hide the title lines"
    required: false
    default: "show"
  username:
    description: "GitHub user to chart. Defaults to the repository owner."
    required: false
    default: ${{ github.repository_owner }}
  token:
    description: "Token used to read contribution data"
    required: false
    default: ${{ github.token }}
  output-dir:
    description: "Folder the SVG is written to"
    required: false
    default: "contrib-charts"

runs:
  using: "composite"
  steps:
    - name: Generate chart
      shell: bash
      env:
        STYLE: ${{ inputs.style }}
        THEME: ${{ inputs.theme }}
        ACCENT: ${{ inputs.accent }}
        MODE: ${{ inputs.mode }}
        FRAME: ${{ inputs.frame }}
        HEADER: ${{ inputs.header }}
        CONTRIB_USERNAME: ${{ inputs.username }}
        OUT_DIR: ${{ inputs.output-dir }}
        GH_TOKEN: ${{ inputs.token }}
        ACTION_PATH: ${{ github.action_path }}
      run: python3 "$ACTION_PATH/generator/generate.py" --style "$STYLE" --theme "$THEME" --accent "$ACCENT" --mode "$MODE" --frame "$FRAME" --header "$HEADER" --out "$OUT_DIR"
