<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="391" viewBox="0 0 1000 391" role="img" aria-label="Activity rings: 6 of 7 days this week, 100 percent of your best month, a 1 day streak">
<defs><clipPath id="panel"><rect x="0" y="0" width="1000" height="391" rx="0"/></clipPath><pattern id="dots" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#a3e635" fill-opacity="0.05"/></pattern></defs>
<style>text { font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Courier New", monospace; } .dim { fill: #9cad86; } .txt { fill: #c5d9a7; } .hi { fill: #a3e635; } .blink { animation: blink 1.1s steps(1) infinite; } @keyframes blink { 50% { opacity: 0; } } .tw { animation: tw 4s ease-in-out infinite; } @keyframes tw { 50% { opacity: 0.25; } }  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>
<rect x="0" y="0" width="1000" height="391" rx="0" fill="#08080a"/>
<g clip-path="url(#panel)"><g transform="translate(0 -50)"><circle cx="270" cy="245" r="150" fill="none" stroke="#21262d" stroke-width="24"/><path d="M270 95A150 150 0 1 1 152.7 151.5" fill="none" stroke="#a3e635" stroke-opacity="1.0" stroke-width="24" stroke-linecap="round"/><circle cx="270" cy="245" r="116" fill="none" stroke="#21262d" stroke-width="24"/><path d="M270 129A116 116 0 1 1 269.6 129.0" fill="none" stroke="#a3e635" stroke-opacity="0.75" stroke-width="24" stroke-linecap="round"/><circle cx="270" cy="245" r="82" fill="none" stroke="#21262d" stroke-width="24"/><path d="M270 163A82 82 0 0 1 296.6 167.4" fill="none" stroke="#a3e635" stroke-opacity="0.5" stroke-width="24" stroke-linecap="round"/><text x="270" y="259" text-anchor="middle" class="hi" font-size="44" font-weight="700">1d</text><text x="270" y="283" text-anchor="middle" class="dim" font-size="14">streak</text><rect x="560" y="116" width="10" height="64" rx="5" fill="#a3e635" fill-opacity="1.0"/><text x="590" y="136" class="dim" font-size="14" letter-spacing="2">WEEK</text><text x="590" y="170" class="hi" font-size="40" font-weight="700">6/7</text><text x="720" y="170" class="dim" font-size="15">active days in the last 7</text><rect x="560" y="208" width="10" height="64" rx="5" fill="#a3e635" fill-opacity="0.75"/><text x="590" y="228" class="dim" font-size="14" letter-spacing="2">MONTH</text><text x="590" y="262" class="hi" font-size="40" font-weight="700">100%</text><text x="720" y="262" class="dim" font-size="15">of your best 30 days</text><rect x="560" y="300" width="10" height="64" rx="5" fill="#a3e635" fill-opacity="0.5"/><text x="590" y="320" class="dim" font-size="14" letter-spacing="2">STREAK</text><text x="590" y="354" class="hi" font-size="40" font-weight="700">1d</text><text x="720" y="354" class="dim" font-size="15">current streak, longest 19d</text></g></g>

</svg>
