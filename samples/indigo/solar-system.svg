" stroke-width="1"/><g class="pl" style="animation-duration:62s;animation-delay:-48s"><circle cx="704" cy="320" r="7.0" fill="#818cf8" fill-opacity="0.59"/></g><circle cx="500" cy="320" r="223" fill="none" stroke="#30363d" stroke-width="1"/><g class="pl" style="animation-duration:68s;animation-delay:-61s"><circle cx="723" cy="320" r="5.8" fill="#818cf8" fill-opacity="0.52"/></g><circle cx="500" cy="320" r="242" fill="none" stroke="#30363d" stroke-width="1"/><g class="pl" style="animation-duration:74s;animation-delay:0s"><circle cx="742" cy="320" r="11.0" fill="#818cf8" fill-opacity="1.00"/></g><circle cx="500" cy="320" r="261" fill="none" stroke="#30363d" stroke-width="1"/><g class="pl" style="animation-duration:80s;animation-delay:-7s"><circle cx="761" cy="320" r="7.0" fill="#818cf8" fill-opacity="0.59"/></g></g></g>

