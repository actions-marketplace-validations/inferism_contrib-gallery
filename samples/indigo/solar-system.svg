<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="592" viewBox="0 0 1000 592" role="img" aria-label="Solar system with one planet for each of the last 12 months, bigger planets for busier months">
<defs><clipPath id="panel"><rect x="0" y="0" width="1000" height="592" rx="0"/></clipPath><pattern id="dots" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#818cf8" fill-opacity="0.05"/></pattern></defs>
<style>text { font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Courier New", monospace; } .dim { fill: #9496b7; } .txt { fill: #bbbee2; } .hi { fill: #818cf8; } .blink { animation: blink 1.1s steps(1) infinite; } @keyframes blink { 50% { opacity: 0; } } .tw { animation: tw 4s ease-in-out infinite; } @keyframes tw { 50% { opacity: 0.25; } } @keyframes orbit { to { transform: rotate(360deg); } } .pl { transform-origin: 500px 320px; animation: orbit 20s linear infinite; } @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>
<rect x="0" y="0" width="1000" height="592" rx="0" fill="#08080a"/>
